<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMENTUM CORE MONITOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-slate-100 font-sans min-h-screen p-6">

    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-gray-900 pb-4 mb-6 gap-4">
        <div>
            <h1 class="text-xl font-black tracking-wider text-white">⚡ MOMENTUM DISCOVERY ENGINE</h1>
            <p class="text-xs text-gray-500 font-mono">Real-time cross-asset tracking stream</p>
        </div>
        <div>
            <span id="socket-status-badge" class="px-3 py-1.5 text-xs font-mono font-bold rounded bg-amber-950 text-amber-400 border border-amber-900 animate-pulse">CONNECTING TO CLOUD ENGINE...</span>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-gray-900/40 p-4 rounded-xl border border-gray-900">
            <h2 class="text-sm font-bold font-mono text-blue-400 mb-3 flex justify-between">
                <span>🪙 CRYPTO MONITOR</span>
                <span class="text-[10px] text-gray-500">LIVE</span>
            </h2>
            <div class="overflow-y-auto h-[500px] pr-1">
                <div id="crypto-feed" class="flex flex-col gap-3"></div>
            </div>
        </div>

        <div class="bg-gray-900/40 p-4 rounded-xl border border-gray-900">
            <h2 class="text-sm font-bold font-mono text-emerald-400 mb-3 flex justify-between">
                <span>🇮🇳 INDIAN NSE STREAM</span>
                <span class="text-[10px] text-gray-500">MARKET HOURS</span>
            </h2>
            <div class="overflow-y-auto h-[500px] pr-1">
                <div id="nse-feed" class="flex flex-col gap-3"></div>
            </div>
        </div>

        <div class="bg-gray-900/40 p-4 rounded-xl border border-gray-900">
            <h2 class="text-sm font-bold font-mono text-teal-400 mb-3 flex justify-between">
                <span>💧 FOREX VELOCITY</span>
                <span class="text-[10px] text-gray-500">24 HOURS</span>
            </h2>
            <div class="overflow-y-auto h-[500px] pr-1">
                <div id="forex-feed" class="flex flex-col gap-3"></div>
            </div>
        </div>
    </main>

    <script>
        const BACKEND_HTTP = "https://momentum-scanner-usre.onrender.com";
        const BACKEND_WS = "wss://momentum-scanner-usre.onrender.com";
        let heartbeatInterval = null;

        function connectSocket() {
            const socket = new WebSocket(BACKEND_WS);

            socket.onopen = () => {
                const badge = document.getElementById('socket-status-badge');
                badge.className = "px-3 py-1.5 text-xs font-mono font-bold rounded bg-emerald-950 text-emerald-400 border border-emerald-900";
                badge.textContent = "CONNECTED TO CLOUD";

                clearInterval(heartbeatInterval);
                heartbeatInterval = setInterval(() => {
                    if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({
                        type: 'PING'
                    }));
                }, 10000);
            };

            socket.onmessage = (event) => {
                try {
                    const payload = JSON.parse(event.data);
                    if (payload.type !== 'PONG') appendSignalCard(payload);
                } catch (err) {}
            };

            socket.onclose = () => {
                clearInterval(heartbeatInterval);
                const badge = document.getElementById('socket-status-badge');
                badge.className = "px-3 py-1.5 text-xs font-mono font-bold rounded bg-red-950 text-red-400 border border-red-900 animate-pulse";
                badge.textContent = "RECONNECTING...";
                setTimeout(connectSocket, 4000);
            };
        }

        function appendSignalCard(data) {
            const containerId = data.market === 'CRYPTO' ? 'crypto-feed' : (data.market === 'NSE' ? 'nse-feed' : 'forex-feed');
            const targetContainer = document.getElementById(containerId);
            if (!targetContainer) return;

            const existingCard = document.getElementById(`card-${data.symbol}`);
            if (existingCard) existingCard.remove();

            const card = document.createElement('div');
            card.id = `card-${data.symbol}`;

            const isUp = data.change >= 0;
            const borderAccent = isUp ? 'border-emerald-900/50 hover:border-emerald-500/40' : 'border-red-900/50 hover:border-red-500/40';
            const badgeColor = isUp ? 'bg-emerald-950 text-emerald-400' : 'bg-red-950 text-red-400';
            const currencyMarker = data.market === 'NSE' ? '₹' : (data.market === 'FOREX' ? '' : '$');

            card.className = `bg-gray-950 p-4 rounded-lg font-mono text-xs border ${borderAccent} transition-all shadow-md`;
            card.innerHTML = `
                <div class="flex justify-between items-center font-bold mb-2">
                    <span class="text-slate-200 text-sm">${data.symbol}</span>
                    <span class="px-2 py-0.5 rounded text-[11px] ${badgeColor}">${isUp ? '▲' : '▼'} ${data.change}%</span>
                </div>
                <div class="flex justify-between text-gray-400 mb-2">
                    <span>Price: ${currencyMarker}${data.currentPrice.toFixed(2)}</span>
                    <span class="text-gray-500">${data.timestamp || ''}</span>
                </div>
                <p class="text-[11px] text-gray-400 bg-gray-900 p-2 rounded leading-relaxed border border-gray-800/40">${data.news || 'Analyzing trend shifts...'}</p>
            `;

            targetContainer.insertBefore(card, targetContainer.firstChild);
        }

        async function seedInitialCache() {
            try {
                const res = await fetch(`${BACKEND_HTTP}/api/history`);
                const cache = await res.json();
                if (Array.isArray(cache)) cache.forEach(data => appendSignalCard(data));
            } catch (e) {
                console.error("Cache preload bypassed:", e);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            connectSocket();
            seedInitialCache();
        });
    </script>
</body>

</html>
