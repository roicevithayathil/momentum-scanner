<script>
    // ✨ FIXED: Corrected subdomains from 'u5re' to 'usre' to match your actual Render deployment instance
    const BACKEND_HTTP = "https://momentum-scanner-usre.onrender.com";
    const BACKEND_WS = "wss://momentum-scanner-usre.onrender.com";

    let activeTab = "MASTER";
    let socket = null;
    let heartbeatInterval = null;

    let chart = null,
        candleSeries = null,
        currentChartAsset = null;
    let activeCandleMap = new Map();

    // 📈 INITIALIZE TRADINGVIEW
    function initChartContainer() {
        const container = document.getElementById('tv-chart-container');
        if (!container) return;
        chart = LightweightCharts.createChart(container, {
            layout: {
                background: {
                    type: 'solid',
                    color: '#030712'
                },
                textColor: '#94a3b8'
            },
            grid: {
                vertLines: {
                    color: '#111827'
                },
                horzLines: {
                    color: '#111827'
                }
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal
            },
            rightPriceScale: {
                borderColor: '#1f2937'
            },
            timeScale: {
                borderColor: '#1f2937',
                timeVisible: true,
                secondsVisible: true
            }
        });
        candleSeries = chart.addCandlestickSeries({
            upColor: '#10b981',
            downColor: '#ef4444',
            borderUpColor: '#10b981',
            borderDownColor: '#ef4444',
            wickUpColor: '#10b981',
            wickDownColor: '#ef4444'
        });
        new ResizeObserver(entries => {
            if (entries.length && chart) chart.resize(entries[0].contentRect.width, 256);
        }).observe(container);
    }

    function switchChartFocus(symbol) {
        currentChartAsset = symbol;
        document.getElementById('active-chart-title').textContent = `STREAMING TREND LAYER: ${symbol}`;
        if (candleSeries) {
            candleSeries.setData([]);
            activeCandleMap.delete(symbol);
        }
        document.getElementById('chart-legend-metrics').textContent = `O: -- | H: -- | L: -- | C: --`;
    }

    function pushDataToChart(data) {
        if (!candleSeries) return;
        if (!currentChartAsset) switchChartFocus(data.symbol);
        if (data.symbol !== currentChartAsset) return;

        const p = parseFloat(data.currentPrice);
        const ts = Math.floor(Date.now() / 1000);
        let activeCandle = activeCandleMap.get(data.symbol);

        if (!activeCandle) {
            activeCandle = {
                time: ts,
                open: p,
                high: p,
                low: p,
                close: p
            };
            activeCandleMap.set(data.symbol, activeCandle);
        } else {
            activeCandle.close = p;
            if (p > activeCandle.high) activeCandle.high = p;
            if (p < activeCandle.low) activeCandle.low = p;
        }
        candleSeries.update(activeCandle);
        document.getElementById('chart-legend-metrics').textContent = `O: ${activeCandle.open.toFixed(2)} | H: ${activeCandle.high.toFixed(2)} | L: ${activeCandle.low.toFixed(2)} | C: ${activeCandle.close.toFixed(2)}`;
    }

    // 🌐 CONNECTION LAYER WITH AUTOMATIC PROTOCOL RESILIENCE
    function setupWebSocket() {
        console.log("Attempting WebSocket handshake to: " + BACKEND_WS);
        socket = new WebSocket(BACKEND_WS);

        socket.onopen = () => {
            console.log("WebSocket connection verified by browser.");
            const badge = document.getElementById('socket-status-badge');
            badge.className = "px-2.5 py-1 text-[10px] font-mono font-bold rounded bg-emerald-950 text-emerald-400 border border-emerald-900";
            badge.textContent = "SYNCHRONIZED METRICS";

            clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(() => {
                if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({
                    type: 'PING'
                }));
            }, 7500);
        };

        socket.onmessage = (event) => {
            try {
                const parsed = JSON.parse(event.data);
                if (parsed.type !== 'PONG') renderMetricsPacket(parsed);
            } catch (e) {}
        };

        socket.onclose = (e) => {
            console.log("WebSocket disconnected. Reason: ", e.reason || "No explicit reason.");
            clearInterval(heartbeatInterval);
            const badge = document.getElementById('socket-status-badge');
            badge.className = "px-2.5 py-1 text-[10px] font-mono font-bold rounded bg-red-950 text-red-400 border border-red-900 animate-pulse";
            badge.textContent = "NETWORK RECONNECTING...";
            setTimeout(setupWebSocket, 4000);
        };

        socket.onerror = (err) => {
            console.error("WebSocket transport level fault captured: ", err);
        };
    }

    async function seedHistoricalMatrix() {
        try {
            const res = await fetch(`${BACKEND_HTTP}/api/history`);
            const matrix = await res.json();
            if (Array.isArray(matrix)) matrix.forEach(p => renderMetricsPacket(p));
        } catch (e) {
            console.error("HTTP History seed failure: ", e);
        }
    }

    // 🖥️ UI VIEW ROUTER RENDER ENGINE
    function renderMetricsPacket(data) {
        pushDataToChart(data);

        const tableId = data.market === 'CRYPTO' ? 'crypto-table-body' : (data.market === 'NSE' ? 'nse-table-body' : 'forex-table-body');
        const targetTable = document.getElementById(tableId);
        if (!targetTable) return;

        const alternateRow = document.getElementById(`row-${data.symbol}`);
        if (alternateRow) alternateRow.remove();

        const tr = document.createElement('tr');
        tr.id = `row-${data.symbol}`;
        tr.className = "border-b border-gray-900/60 font-mono text-[11px] hover:bg-gray-900/40 transition-all cursor-pointer";
        tr.setAttribute('onclick', `switchChartFocus('${data.symbol}')`);

        const isUp = data.change >= 0;
        const textAccent = isUp ? 'text-emerald-400' : 'text-red-400';
        const unitMarker = data.market === 'NSE' ? '₹' : (data.market === 'FOREX' ? '' : '$');
        const parsedVolume = data.volume >= 1000000 ? `${(data.volume/1000000).toFixed(1)}M` : (data.volume >= 1000 ? `${(data.volume/1000).toFixed(1)}K` : data.volume.toFixed(0));

        const bias = data.predictedBias || "CALCULATING";
        const badgeColor = bias.includes('UPTREND') ? 'bg-emerald-950 text-emerald-400 border-emerald-900' : (bias.includes('RISK') ? 'bg-red-950 text-red-400 border-red-900' : 'bg-gray-900 text-gray-500 border-gray-800');

        tr.innerHTML = `
            <td class="py-2 text-gray-600">${data.timestamp.split(' ')[0]}</td>
            <td class="py-2 font-bold text-slate-300">
                <div class="flex flex-col">
                    <span>${data.symbol}</span>
                    <span class="text-[8px] border tracking-tighter px-1 rounded font-mono max-w-max mt-0.5 ${badgeColor}">📊 ${data.detectedPattern || 'SCANNING'}</span>
                </div>
            </td>
            <td class="py-2 text-slate-400">${unitMarker}${data.currentPrice.toFixed(2)}</td>
            <td class="py-2 text-gray-500 font-bold">${parsedVolume}</td>
            <td class="py-2 text-right font-black ${textAccent}">${isUp ? '+' : ''}${data.change}%</td>
        `;

        targetTable.insertBefore(tr, targetTable.firstChild);
        if (targetTable.children.length > 30) targetTable.lastChild.remove();

        if (data.aiPredictedTarget) {
            const aiFeed = document.getElementById('ai-predictions-list');
            const existingCard = document.getElementById(`ai-card-${data.symbol}`);
            if (existingCard) existingCard.remove();

            const card = document.createElement('div');
            card.id = `ai-card-${data.symbol}`;
            card.className = "bg-gray-950 p-3 rounded-lg font-mono text-[11px] border border-purple-900/30 shadow-md transition-all hover:border-purple-500/40";

            const alertMessageHtml = data.news ?
                `<div class="mt-2 text-[10px] bg-gray-900 p-2 rounded border border-gray-800/80 text-slate-300 leading-relaxed">${data.news}</div>` :
                '';

            card.innerHTML = `
                <div class="flex justify-between font-bold mb-1">
                    <span class="text-purple-400">🤖 ML FOCUS: ${data.symbol}</span>
                    <span class="text-gray-600">${data.timestamp}</span>
                </div>
                <div class="flex justify-between text-[10px] my-1 text-gray-500">
                    <span>Buffer: ${data.modelAccuracyPoints} Ticks</span>
                    <span class="text-purple-400 font-bold">Confidence: ${data.modelConfidence}%</span>
                </div>
                <div class="border-t border-gray-900 pt-1.5 flex justify-between text-[10px]">
                    <span class="text-gray-400">Spot: ${data.currentPrice.toFixed(2)}</span>
                    <span class="text-emerald-400 font-bold">OLS Target: ${data.aiPredictedTarget.toFixed(2)}</span>
                </div>
                ${alertMessageHtml}
            `;
            aiFeed.insertBefore(card, aiFeed.firstChild);
            if (aiFeed.children.length > 15) aiFeed.lastChild.remove();
        }
    }

    function switchTab(target) {
        activeTab = target;
        const lists = ['MASTER', 'CRYPTO', 'NSE', 'FOREX'];
        lists.forEach(t => {
            const btn = document.getElementById(`tab-btn-${t}`);
            const col = document.getElementById(`desk-${t}`);

            if (t === target || target === 'MASTER') {
                if (col) col.style.display = "block";
                if (btn && t === target) {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold font-mono transition-all bg-blue-600 text-white shadow shadow-blue-900/50";
                } else if (btn) {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold font-mono transition-all bg-gray-900 text-gray-400 hover:bg-gray-800";
                }
            } else {
                if (col) col.style.display = "none";
                if (btn) btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold font-mono transition-all bg-gray-900 text-gray-400 hover:bg-gray-800";
            }
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        initChartContainer();
        setupWebSocket();
        seedHistoricalMatrix();
    });
</script>
